name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: '1.3'

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (svelte-check)
        run: bun run check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test

  migrate:
    name: DB migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cloudstudent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d cloudstudent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://app:password@127.0.0.1:5432/cloudstudent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations from scratch
        run: bun run db:migrate

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [migrate]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cloudstudent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d cloudstudent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://app:password@127.0.0.1:5432/cloudstudent
      APP_URL: http://127.0.0.1:4173
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use-32chars
      BETTER_AUTH_URL: http://127.0.0.1:4173
      PUBLIC_APP_NAME: CloudStudent
      NODE_ENV: production
      E2E_PORT: '4173'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
      - name: Install Playwright browsers
        run: bun run test:e2e:install
      - name: Run Playwright tests
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cloudstudent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
