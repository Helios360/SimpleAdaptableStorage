services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded files (CVs, IDs, pitch videos) on the host so they
      # survive image rebuilds / container recreation. Maps to UPLOADS_DIR=./uploads.
      - ./uploads:/app/uploads
    networks:
      - shared
      - sharedNet

networks:
  shared:
    external: true
    name: dbnet
  sharedNet:
    external: true
