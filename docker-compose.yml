services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded files (CVs, IDs, pitch videos) on the host so they
      # survive image rebuilds / container recreation. Maps to UPLOADS_DIR=./uploads.
      - ./uploads:/app/uploads
    networks:
      - shared
      - sharedNet
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:3000/api/healthz | grep -q '\"status\":\"ok\"'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  shared:
    external: true
    name: dbnet
  sharedNet:
    external: true
